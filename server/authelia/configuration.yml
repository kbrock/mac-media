---
theme: dark

server:
  address: tcp://0.0.0.0:9091

log:
  level: info

authentication_backend:
  file:
    path: /config/users_database.yml

session:
  cookies:
    - name: authelia_session
      domain: home.thebrocks.net
      authelia_url: https://auth.home.thebrocks.net
      expiration: 12h
      inactivity: 2h
  redis:
    host: 127.0.0.1
    port: 6379

storage:
  postgres:
    address: tcp://127.0.0.1:5432
    database: authelia
    username: authelia

notifier:
  disable_startup_check: true
  filesystem:
    filename: /config/notification.txt

access_control:
  default_policy: one_factor

# identity_providers: oidc — added in Phase 4 (Jellyfin) and Phase 5 (Immich)
