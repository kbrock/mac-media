---
theme: dark

server:
  address: tcp://0.0.0.0:9091

log:
  level: info

authentication_backend:
  file:
    path: /config/users_database.yml

session:
  cookies:
    - name: authelia_session
      domain: home.thebrocks.net
      authelia_url: https://auth.home.thebrocks.net
      expiration: 12h
      inactivity: 2h
  redis:
    host: 127.0.0.1
    port: 6379

storage:
  postgres:
    address: tcp://127.0.0.1:5432
    database: authelia
    username: authelia

notifier:
  disable_startup_check: true
  filesystem:
    filename: /config/notification.txt

access_control:
  default_policy: one_factor

identity_providers:
  oidc:
    jwks:
      - key_id: default
        algorithm: RS256
        use: sig
        key: {{ secret "/config/oidc.key" | mindent 10 "|" | msquote }}
    clients:
      - client_id: jellyfin
        client_name: Jellyfin
        client_secret: {{ secret "/config/jellyfin-client-secret.hash" | msquote }}
        # The plugin's OIDC client (Duende) uses different auth styles for
        # different calls: Basic for the pushed-authorization request, POST
        # body for the token-redemption call. Authelia checks these per
        # endpoint, so both need to be set to match what the plugin actually
        # sends rather than assuming one style applies everywhere.
        token_endpoint_auth_method: client_secret_post
        pushed_authorization_request_endpoint_auth_method: client_secret_basic
        authorization_policy: one_factor
        redirect_uris:
          - https://movies.home.thebrocks.net/sso/OID/redirect/authelia
        scopes:
          - openid
          - profile
          - groups
        userinfo_signed_response_alg: none

# identity_providers.oidc.clients.immich — added in Phase 5
