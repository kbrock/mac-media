map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Port 80: HTTP → HTTPS redirects ---------------------------------------

server {
    listen 80;
    server_name home.thebrocks.net
                hub.home.thebrocks.net
                movies.home.thebrocks.net
                music.home.thebrocks.net
                photos.home.thebrocks.net
                auth.home.thebrocks.net;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name hub movies music photos auth home;
    return 301 https://$host.home.thebrocks.net$request_uri;
}

server {
    listen 80;
    server_name mac-media;
    return 301 https://home.thebrocks.net$request_uri;
}

# --- Shared SSL config -----------------------------------------------------

ssl_certificate     /etc/letsencrypt/live/home.thebrocks.net/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/home.thebrocks.net/privkey.pem;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers         HIGH:!aNULL:!MD5;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;

# --- Port 443: per-service blocks ------------------------------------------

server {
    listen 443 ssl;
    http2 on;
    server_name home.thebrocks.net;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name auth.home.thebrocks.net;

    location / {
        proxy_pass http://127.0.0.1:9091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name hub.home.thebrocks.net;

    location / {
        auth_request /authelia;
        auth_request_set $user $upstream_http_remote_user;
        error_page 401 = @authelia_redirect;

        proxy_pass http://127.0.0.1:8123;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Remote-User $user;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }

    include /etc/nginx/authelia-forward-auth.conf;
}

server {
    listen 443 ssl;
    http2 on;
    server_name movies.home.thebrocks.net;
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name music.home.thebrocks.net;

    location /rest/ {
        proxy_pass http://127.0.0.1:4533;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Remote-User $arg_u;
    }

    location / {
        auth_request /authelia;
        auth_request_set $user $upstream_http_remote_user;
        error_page 401 = @authelia_redirect;

        proxy_pass http://127.0.0.1:4533;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Remote-User $user;
    }

    include /etc/nginx/authelia-forward-auth.conf;
}

server {
    listen 443 ssl;
    http2 on;
    server_name photos.home.thebrocks.net;

    location / {
        return 503 "Immich not yet deployed.\n";
        add_header Content-Type text/plain;
    }
}
