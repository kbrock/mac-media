location = /authelia {
    internal;
    proxy_pass http://127.0.0.1:9091/api/authz/auth-request;
    # Jellyfin's own client sends its custom `Authorization: MediaBrowser ...`
    # header on every API call. Authelia tries to parse any Authorization
    # header as an auth scheme, doesn't recognize "MediaBrowser", and denies
    # the request with 401 + WWW-Authenticate: Basic even when the session
    # cookie is valid — the denial's WWW-Authenticate header then reaches the
    # browser and pops a native Basic-auth dialog. Strip it before Authelia
    # sees it; the cookie alone is what we want it to authenticate on here.
    proxy_set_header Authorization "";
    proxy_set_header Proxy-Authorization "";
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URL $scheme://$host$request_uri;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-URI $request_uri;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Method $request_method;
}

location @authelia_redirect {
    # Real page navigations (Sec-Fetch-Mode: navigate) can follow a
    # cross-origin redirect fine — that's how SSO login normally works.
    # Background fetch/XHR calls a page makes on its own (manifest fetch,
    # service worker registration, "public" API probes before login) can't:
    # the browser blocks the cross-origin hop via CORS, since the redirect
    # target never sends CORS headers. Redirecting those just produces a
    # console error instead of the intended failure, breaking the app in a
    # confusing way. So only redirect real navigations; everything else gets
    # a plain same-origin 401, which the calling code can actually see and
    # handle. Endpoints a service genuinely needs to serve pre-login still
    # need their own auth_request bypass (see hub/movies/music blocks).
    if ($http_sec_fetch_mode != navigate) {
        return 401;
    }
    return 302 https://auth.home.thebrocks.net/?rd=$scheme://$host$request_uri;
}
